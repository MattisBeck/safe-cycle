name: CI

on:
  push:
  pull_request:
  workflow_dispatch:


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check style, docstrings and annotations
        run: uv run ruff check .

      - name: Check types
        run: uv run mypy

      - name: Run tests
        run: uv run pytest
