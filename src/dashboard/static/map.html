<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Cycle - Kartenansicht</title>
    <!-- Leaflet CSS einbinden (wird für die Darstellung der Karte benötigt) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Unsere eigene CSS-Datei einbinden -->
    <link rel="stylesheet" href="map.css" />
</head>
<body>
    <!-- 
        Das div-Element, in dem die Karte gerendert wird. 
        Die ID 'map_container' wird im JavaScript verwendet, um dieses Element zu finden.
    -->
    <div id="map_container"></div>

    <!-- Leaflet JavaScript Bibliothek einbinden -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Unsere eigene JavaScript-Datei einbinden -->
    <script src="map.js"></script>
</body>
</html>
