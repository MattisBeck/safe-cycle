[project]
name = "safe-cycle"
version = "0.1.0"
description = "Erfassung und Auswertung kritischer Überholvorgänge bei Fahrrädern"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [

    "numpy>=2.5.0",
    "opencv-python>=4.13.0.92",
    "ultralytics>=8.4.68",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ANN", "D", "E", "F", "I", "W"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unused_configs = true
