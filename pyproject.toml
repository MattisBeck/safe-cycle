[project]
name = "safe-cycle"
version = "0.1.0"
description = "Erfassung und Auswertung kritischer Überholvorgänge bei Fahrrädern"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "adafruit-blinka>=9.1.0",
    "adafruit-circuitpython-vl53l0x>=3.6.19",
    "adafruit-extended-bus>=1.0.2",
    "numpy>=1.26,<2",
    "paho-mqtt==2.1.0",
]

[project.optional-dependencies]
desktop-vision = [
    "opencv-python>=4.6,<4.12",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ANN", "D", "E", "F", "I", "W"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["cv2", "adafruit_vl53l1x", "adafruit_extended_bus"]
ignore_missing_imports = true
